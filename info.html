<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goa Info</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/info.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

<header class="topHeader">

<div class="logoArea">

<i class="fa-solid fa-leaf logoIcon"></i>

<div>

<h1>Goa Bazar</h1>

<p>Daily Prices & Useful Information</p>

</div>

</div>

<button id="refreshBtn">

<i class="fa-solid fa-rotate-right"></i>

</button>

</header>

<div class="lastUpdated" id="lastUpdated">

Loading...

</div>

<section class="card">

<h2>

<i class="fa-solid fa-cloud-sun-rain"></i>

Weather Forecast

</h2>

<div id="weatherCards" class="weatherCards">

Loading...

</div>

</section>

<section class="card clickable" id="petrolCard">

<h2>

<i class="fa-solid fa-gas-pump"></i>

Petrol Price

</h2>

<div class="row">

<div>

<h3>Panjim</h3>

<p id="petrolPanjim">--</p>

</div>

<div>

<h3>Margao</h3>

<p id="petrolMargao">--</p>

</div>

</div>

</section>

<section class="card clickable" id="dieselCard">

<h2>

<i class="fa-solid fa-oil-can"></i>

Diesel Price

</h2>

<div class="row">

<div>

<h3>Panjim</h3>

<p id="dieselPanjim">--</p>

</div>

<div>

<h3>Margao</h3>

<p id="dieselMargao">--</p>

</div>

</div>

</section>

<section class="card clickable">

<h2>

<i class="fa-solid fa-fire"></i>

CNG

</h2>

<p id="cngPrice">--</p>

</section>

<section class="card clickable">

<h2>

<i class="fa-solid fa-fire-flame-curved"></i>

Auto Gas

</h2>

<p id="autogasPrice">--</p>

</section>

<section class="card clickable">

<h2>

<i class="fa-solid fa-gas-cylinder"></i>

Domestic LPG

</h2>

<p id="lpgPrice">--</p>

</section>

<section class="card clickable">

<h2>

<i class="fa-solid fa-coins"></i>

Gold Price

</h2>

<div class="goldGrid">

<div>24K <span id="gold24">--</span></div>

<div>22K <span id="gold22">--</span></div>

<div>21K <span id="gold21">--</span></div>

<div>20K <span id="gold20">--</span></div>

<div>18K <span id="gold18">--</span></div>

</div>

</section>

<section class="card clickable">

<h2>

<i class="fa-solid fa-medal"></i>

Silver Price

</h2>

<p id="silverPrice">--</p>

</section>

</div>

<script src="js/info.js"></script>

</body>
</html>
