<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Construction Prices | Goa Bazar</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#222;padding-bottom:90px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:18px;background:#fff;position:sticky;top:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.header-buttons{display:flex;gap:10px}
.icon-btn{width:46px;height:46px;border:none;border-radius:12px;background:#1976d2;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.update-card,.search-box,.statCard,.categoryCard{background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.update-card{margin:18px;padding:18px;display:flex;justify-content:space-between;align-items:center}
.search-box{margin:18px;padding:14px;display:flex;gap:10px;align-items:center}
.search-box input{border:none;outline:none;width:100%;font-size:16px}
.statsBar{display:flex;gap:12px;padding:0 18px 18px}
.statCard{flex:1;padding:16px;text-align:center}
#categoryContainer{padding:0 18px 18px}
.categoryHeader{display:flex;justify-content:space-between;padding:16px;cursor:pointer;font-weight:bold}
.categoryBody{display:none;padding:0 16px 16px}
.itemRow{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}
.itemPrice{background:#0f9d58;color:#fff;padding:6px 12px;border-radius:16px}
.loading,.errorBox{text-align:center;padding:40px}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.1)}
.bottom-nav a{text-decoration:none;color:#666;font-size:12px;display:flex;flex-direction:column;align-items:center}
.bottom-nav a.active{color:#1976d2}
#scrollTopBtn{position:fixed;right:20px;bottom:90px;display:none;border:none;border-radius:50%;width:52px;height:52px;background:#1976d2;color:#fff}
@media(max-width:480px){.statsBar{flex-direction:column}.update-card{flex-direction:column;align-items:flex-start}.itemRow{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<header class="top-header">
<div><h2>🏗️ Construction Prices</h2><small>Goa Construction Material Rates</small></div>
<div class="header-buttons">
<button id="refreshBtn" class="icon-btn">↻</button>
<button id="shareBtn" class="icon-btn">⇪</button>
</div>
</header>

<section class="update-card">
<div><small>Last Updated</small><h3 id="lastUpdated">Loading...</h3></div>
<div><b>LIVE</b></div>
</section>

<section class="search-box">
<span>🔍</span>
<input id="searchInput" placeholder="Search construction material...">
</section>

<div class="statsBar">
<div class="statCard"><h2 id="totalCategories">0</h2><p>Categories</p></div>
<div class="statCard"><h2 id="totalItems">0</h2><p>Materials</p></div>
<div class="statCard"><h2>LIVE</h2><p>Status</p></div>
</div>

<div id="categoryContainer"><div class="loading">Loading...</div></div>

<button id="scrollTopBtn">↑</button>

<nav class="bottom-nav">
<a href="index.html">Home</a>
<a href="vegetables.html">Vegetables</a>
<a class="active" href="construction.html">Construction</a>
<a href="fuel.html">Fuel</a>
<a href="more.html">More</a>
</nav>

<script>
const DATA_URL="https://raw.githubusercontent.com/vikscan732-del/Goan-farmer-help/main/data/construction.json";
let allCategories=[];

async function loadConstruction(){
const c=document.getElementById("categoryContainer");
c.innerHTML="<div class='loading'>Loading...</div>";
try{
const r=await fetch(DATA_URL+"?t="+Date.now());
const d=await r.json();
allCategories=d.categories||[];
document.getElementById("lastUpdated").textContent=d.updated||"Unknown";
render(allCategories);
}catch(e){
c.innerHTML="<div class='errorBox'>Unable to load data.</div>";
}
}

function render(list){
document.getElementById("totalCategories").textContent=list.length;
let t=0;list.forEach(x=>t+=x.items.length);
document.getElementById("totalItems").textContent=t;
const c=document.getElementById("categoryContainer");
c.innerHTML="";
if(!list.length){c.innerHTML="<div class='errorBox'>No results.</div>";return;}
list.forEach((cat,i)=>{
const card=document.createElement("div");
card.className="categoryCard";
card.innerHTML=`<div class="categoryHeader"><span>${cat.category}</span><span>▼</span></div><div class="categoryBody">${cat.items.map(it=>`<div class="itemRow"><div><b>${it.name}</b><br><small>${it.unit}</small></div><div class="itemPrice">${it.price}</div></div>`).join("")}</div>`;
card.querySelector(".categoryHeader").onclick=()=>{
const b=card.querySelector(".categoryBody");
b.style.display=b.style.display==="block"?"none":"block";
};
c.appendChild(card);
});
}

searchInput.oninput=e=>{
const q=e.target.value.toLowerCase();
if(!q){render(allCategories);return;}
render(allCategories.map(c=>({category:c.category,items:c.items.filter(i=>(c.category+i.name+i.unit+i.price).toLowerCase().includes(q))})).filter(c=>c.items.length));
};

refreshBtn.onclick=loadConstruction;
shareBtn.onclick=()=>navigator.share&&navigator.share({title:"Construction Prices",url:location.href});
window.onscroll=()=>scrollTopBtn.style.display=scrollY>300?"block":"none";
scrollTopBtn.onclick=()=>scrollTo({top:0,behavior:"smooth"});
loadConstruction();
</script>
</body>
</html>
