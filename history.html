<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Price History</title>

<link rel="stylesheet" href="css/history.css">

</head>

<body>

<header class="topbar">

<button id="backBtn">←</button>

<h1 id="pageTitle">Price History</h1>

</header>

<div class="container">

<!-- Summary -->

<div class="summary-card">

<div class="summary-left">
<div class="small">Today's Price</div>
<h2 id="todayPrice">₹0.00</h2>
<div id="updatedDate">Updated: --</div>
</div>

<div class="summary-right">

<div id="trendIcon" class="trendIcon">🟢</div>

<div id="trendTitle">No Change</div>

<div id="trendValue">₹0.00</div>

</div>

</div>

<!-- Trend -->

<h2 class="sectionTitle">Price Trend</h2>

<div class="chartCard">

<svg id="trendChart"
viewBox="0 0 360 220"
preserveAspectRatio="none">

<defs>

<linearGradient id="fillGradient"
x1="0"
y1="0"
x2="0"
y2="1">

<stop offset="0%"
stop-color="#1b8f2a"
stop-opacity="0.35"/>

<stop offset="100%"
stop-color="#1b8f2a"
stop-opacity="0.05"/>

</linearGradient>

</defs>

<!-- Grid -->
<g id="gridLines"></g>

<!-- Filled Area -->
<path
id="areaPath"
fill="url(#fillGradient)">
</path>

<!-- Trend Line -->
<path
id="linePath"
fill="none"
stroke="#198d24"
stroke-width="3.5"
stroke-linecap="round"
stroke-linejoin="round">
</path>

<!-- Points -->
<g id="pointGroup"></g>

<!-- X Labels -->
<g id="xLabels"></g>

<!-- Y Labels -->
<g id="yLabels"></g>

</svg>

</div>

<!-- Statistics -->

<h2 class="sectionTitle">Statistics</h2>

<div class="statsGrid">

<div class="statCard">
<div class="label">Today</div>
<div id="todayPriceStat">₹0.00</div>
</div>

<div class="statCard">
<div class="label">Yesterday</div>
<div id="yesterdayPrice">₹0.00</div>
</div>

<div class="statCard">
<div class="label">Highest</div>
<div id="highestPrice">₹0.00</div>
</div>

<div class="statCard">
<div class="label">Lowest</div>
<div id="lowestPrice">₹0.00</div>
</div>

<div class="statCard">
<div class="label">Average</div>
<div id="averagePrice">₹0.00</div>
</div>

</div>

<!-- History -->

<h2 class="sectionTitle">Price History</h2>

<table class="historyTable">

<thead>

<tr>

<th>Date</th>

<th>Price</th>

</tr>

</thead>

<tbody id="historyTable">

</tbody>

</table>

</div>

<script src="js/history.js"></script>

</body>
</html>
