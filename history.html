<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Price History</title>

<link rel="stylesheet" href="css/history.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<h1 id="pageTitle">Loading...</h1>

<button id="backBtn">
⬅ Back
</button>

<div class="chartCard">

<div class="summary-card">
  <div class="summary-price">
    <span class="label">Today's Price</span>
    <h2 id="todayPrice">₹0.00</h2>
    <small id="updatedDate">Updated: --</small>
  </div>

  <div class="summary-trend">
    <div id="trendIcon" class="trend-icon">🟢 ⬆️</div>
    <h3 id="trendTitle">Price Increased</h3>
    <p id="trendValue">+₹0.00 (0.00%)</p>
  </div>
</div>
  <canvas id="historyChart"></canvas>

</div>

<div class="statsGrid">

<div class="stat">
<div class="label">Today</div>
<div id="todayPriceStat">--</div>
</div>

<div class="stat">
<div class="label">Yesterday</div>
<div id="yesterdayPrice">--</div>
</div>

<div class="stat">
<div class="label">Highest</div>
<div id="highestPrice">--</div>
</div>

<div class="stat">
<div class="label">Lowest</div>
<div id="lowestPrice">--</div>
</div>

<div class="stat">
<div class="label">Average</div>
<div id="averagePrice">--</div>
</div>

</div>

<table>

<thead>

<tr>

<th>Date</th>

<th>Price</th>

</tr>

</thead>

<tbody id="historyTable">

</tbody>

</table>

</div>

<script src="js/history.js"></script>

</body>
</html>
