<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Vegetable Prices · Goa</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f4f9fe;
            color: #1e293b;
            padding-bottom: 90px;
        }

        /* ── TOP HEADER ── */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(46, 125, 50, 0.12);
            box-shadow: 0 2px 12px rgba(0, 20, 30, 0.04);
        }

        .top-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(145deg, #1b5e20, #388e3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .top-header small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 2px 14px;
            border-radius: 30px;
            -webkit-text-fill-color: #1b5e20;
            margin-top: 2px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 14px;
            background: #2e7d32;
            color: #fff;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: 0.15s;
        }
        .icon-btn:active {
            transform: scale(0.90);
        }

        /* ── SUBTITLE (small + colourful) ── */
        .subtitle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 18px 0;
            margin-top: 6px;
        }

        .subtitle-main {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #1b5e20, #2e7d32, #43a047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle-sub {
            font-size: 0.7rem;
            font-weight: 600;
            color: #558b2f;
            background: #e8f5e9;
            padding: 2px 18px;
            border-radius: 40px;
            margin-top: 2px;
            letter-spacing: 0.4px;
            border: 1px solid #c8e6c9;
            -webkit-text-fill-color: #2e7d32;
        }

        /* ── DATE / TIME BADGES (small) ── */
        .badge-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 8px 18px 4px;
            flex-wrap: wrap;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            padding: 4px 14px 4px 10px;
            border-radius: 60px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #e8f0e8;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e3a2a;
        }

        .badge-item .label {
            color: #5d7b6b;
            font-weight: 500;
        }

        .badge-item .value {
            color: #1b5e20;
            font-weight: 700;
        }

        .badge-item .material-icons-round {
            font-size: 1rem;
            color: #2e7d32;
        }

        /* ── VEGETABLE CARDS (colourful, clickable for history) ── */
        .veg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 14px 18px 20px;
        }

        @media (max-width: 420px) {
            .veg-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }

        .veg-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 14px 14px;
            box-shadow: 0 6px 20px rgba(0, 20, 30, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            transition: 0.1s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .veg-card:active {
            transform: scale(0.97);
        }

        /* each card gets a unique colourful left border & subtle bg */
        .veg-card:nth-child(6n+1) {
            border-left: 6px solid #2e7d32;
            background: linear-gradient(145deg, #fafffa, #f0f9f0);
        }
        .veg-card:nth-child(6n+2) {
            border-left: 6px solid #d84315;
            background: linear-gradient(145deg, #fff8f5, #fdeee8);
        }
        .veg-card:nth-child(6n+3) {
            border-left: 6px solid #1565c0;
            background: linear-gradient(145deg, #f5f9ff, #e8f0fe);
        }
        .veg-card:nth-child(6n+4) {
            border-left: 6px solid #6a1b9a;
            background: linear-gradient(145deg, #faf5ff, #f0e8f8);
        }
        .veg-card:nth-child(6n+5) {
            border-left: 6px solid #e67e22;
            background: linear-gradient(145deg, #fffbf0, #fdf3e0);
        }
        .veg-card:nth-child(6n+6) {
            border-left: 6px solid #00838f;
            background: linear-gradient(145deg, #f0fbfc, #e0f2f4);
        }

        .veg-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f2b1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .veg-change {
            font-size: 0.6rem;
            font-weight: 700;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            border: 1px solid #c8e6c9;
        }

        .veg-change.down {
            background: #ffebee;
            color: #c62828;
            border-color: #ffcdd2;
        }

        .veg-price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 10px;
        }

        .veg-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1b3a2a;
            letter-spacing: -0.5px;
        }

        .veg-price small {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5d7b6b;
            margin-left: 2px;
        }

        .veg-unit {
            font-size: 0.75rem;
            font-weight: 600;
            color: #5d7b6b;
            background: #edf3ed;
            padding: 2px 14px;
            border-radius: 30px;
        }

        /* ── LOADING / ERROR ── */
        .loading,
        .errorBox {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 30px;
            margin: 10px 18px;
            color: #475569;
            font-weight: 500;
        }

        .errorBox {
            background: #ffebee;
            color: #b71c1c;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #5d7b6b;
            font-weight: 500;
        }

        /* ── BOTTOM NAV (colourful) ── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: #ffffffec;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -6px 20px rgba(0, 20, 30, 0.04);
            border-top: 1px solid rgba(0, 0, 0, 0.02);
            z-index: 30;
        }

        .bottom-nav a {
            text-decoration: none;
            color: #5f748e;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            transition: 0.1s;
        }

        .bottom-nav a.active {
            color: #2e7d32;
            background: #e8f5e9;
            font-weight: 700;
        }

        .bottom-nav a:nth-child(1).active {
            background: #e8f0fe;
            color: #1a5f9e;
        }
        .bottom-nav a:nth-child(2).active {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .bottom-nav a:nth-child(3).active {
            background: #fdeee8;
            color: #bf5b2a;
        }
        .bottom-nav a:nth-child(4).active {
            background: #f0e8f8;
            color: #6a4b8a;
        }

        /* ── SCROLL TOP ── */
        #scrollTopBtn {
            position: fixed;
            right: 20px;
            bottom: 96px;
            display: none;
            border: none;
            border-radius: 60px;
            width: 48px;
            height: 48px;
            background: #2e7d32;
            color: #fff;
            font-size: 1.8rem;
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
            cursor: pointer;
            transition: 0.15s;
            z-index: 25;
        }
        #scrollTopBtn:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="top-header">
        <div>
            <h1>🥬 Vegetable Prices</h1>
            <small>Goa Horticulture Corporation Ltd.</small>
        </div>
        <div class="header-buttons">
            <button id="refreshBtn" class="icon-btn">↻</button>
            <button id="shareBtn" class="icon-btn">⇪</button>
        </div>
    </header>

    <!-- SUBTITLE -->
    <div class="subtitle-wrap">
        <span class="subtitle-main">🌱 Goa Horticulture Corporation Ltd.</span>
        <span class="subtitle-sub">Official Daily Vegetable Prices</span>
    </div>

    <!-- DATE / TIME BADGES -->
    <div class="badge-row">
        <div class="badge-item">
            <span class="material-icons-round">schedule</span>
            <span class="label">Last Updated</span>
            <span class="value" id="lastUpdated">--:--</span>
        </div>
        <div class="badge-item">
            <span class="material-icons-round">calendar_today</span>
            <span class="label">Price Date</span>
            <span class="value" id="priceDate">----</span>
        </div>
    </div>

    <!-- VEGETABLE GRID -->
    <div id="vegContainer" class="veg-grid">
        <div class="loading" style="grid-column:1/-1;">Loading vegetables…</div>
    </div>

    <!-- SCROLL TOP -->
    <button id="scrollTopBtn">↑</button>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html">🏠 Home</a>
        <a class="active" href="favourite.html">🥬 Vegetables</a>
        <a href="construction.html">🏗️ Construction</a>
        <a href="info.html">ℹ️ Info</a>
    </nav>

    <script>
        // ── DATA URL (history.json from Goan-farmer-help) ──
        const DATA_URL =
            "https://raw.githubusercontent.com/vikscan732-del/Goan-farmer-help/main/history.json";

        // ── FALLBACK SAMPLE DATA (used if fetch fails) ──
        const FALLBACK_DATA = {
            "Bhendi": [{ "date": "2026-08-04", "price": 36 }],
            "Tomato": [{ "date": "2026-08-04", "price": 29 }],
            "Cabbage": [{ "date": "2026-08-04", "price": 28 }],
            "Carrot": [{ "date": "2026-08-04", "price": 44 }],
            "Cauliflower": [{ "date": "2026-08-04", "price": 33 }],
            "Chilli": [{ "date": "2026-08-04", "price": 50 }],
            "Cluster Beans": [{ "date": "2026-08-04", "price": 47 }],
            "Onion": [{ "date": "2026-08-04", "price": 22 }],
            "Potato": [{ "date": "2026-08-04", "price": 30 }],
            "Brinjal": [{ "date": "2026-08-04", "price": 32 }]
        };

        // ── LOAD VEGETABLES FROM history.json ──
        async function loadVegetables() {
            const container = document.getElementById("vegContainer");
            container.innerHTML =
                '<div class="loading" style="grid-column:1/-1;">Loading vegetables…</div>';

            let data = null;
            let usedFallback = false;

            try {
                const res = await fetch(DATA_URL + "?t=" + Date.now());
                if (!res.ok) throw new Error("HTTP error " + res.status);
                data = await res.json();
            } catch (err) {
                console.warn("Fetch failed, using fallback data", err);
                data = FALLBACK_DATA;
                usedFallback = true;
            }

            // Extract vegetable names and their price history
            let vegNames = Object.keys(data);
            
            // If data is empty or has no keys, use fallback
            if (!vegNames || vegNames.length === 0) {
                data = FALLBACK_DATA;
                vegNames = Object.keys(data);
                usedFallback = true;
            }

            // Get today's date for the badge
            const today = new Date();
            const dateStr = today.toLocaleDateString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
            const timeStr = today.toLocaleTimeString('en-IN', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            document.getElementById("lastUpdated").textContent = timeStr || "06:24 AM";
            document.getElementById("priceDate").textContent = dateStr || "04 Aug 2026";

            // Build vegetable list with latest price
            const vegetableList = vegNames.map(name => {
                const history = data[name] || [];
                const latest = history.length > 0 ? history[history.length - 1] : { price: 0 };
                const previous = history.length > 1 ? history[history.length - 2] : { price: latest.price };
                
                // Calculate change
                let changeText = "No Change";
                let isDown = false;
                if (latest.price > previous.price) {
                    changeText = `+ ₹${(latest.price - previous.price).toFixed(0)}`;
                } else if (latest.price < previous.price) {
                    changeText = `- ₹${(previous.price - latest.price).toFixed(0)}`;
                    isDown = true;
                }
                
                return {
                    name: name,
                    price: `₹${latest.price}`,
                    unit: "kg",
                    change: changeText,
                    isDown: isDown
                };
            });

            renderCards(vegetableList);
        }

        // ── RENDER CARDS (with click → history.html) ──
        function renderCards(list) {
            const container = document.getElementById("vegContainer");
            container.innerHTML = "";

            if (!list || !list.length) {
                container.innerHTML =
                    '<div class="empty-state" style="grid-column:1/-1;">No vegetables available.</div>';
                return;
            }

            list.forEach((veg) => {
                const card = document.createElement("div");
                card.className = "veg-card";

                const changeClass = veg.isDown ? 'down' : '';

                card.innerHTML = `
                    <div class="veg-name">
                        <span>${veg.name}</span>
                        <span class="veg-change ${changeClass}">${veg.change}</span>
                    </div>
                    <div class="veg-price-row">
                        <span class="veg-price">${veg.price} <small>/ ${veg.unit}</small></span>
                        <span class="veg-unit">${veg.unit}</span>
                    </div>
                `;

                // ── PRICE HISTORY CLICK ── navigates to history.html
                card.addEventListener('click', () => {
                    const vegName = encodeURIComponent(veg.name);
                    window.location.href = `history.html?vegetable=${vegName}`;
                });

                container.appendChild(card);
            });
        }

        // ── REFRESH & SHARE ──
        document.getElementById("refreshBtn").addEventListener("click", loadVegetables);
        document.getElementById("shareBtn").addEventListener("click", () => {
            if (navigator.share) {
                navigator.share({ title: "Vegetable Prices · Goa", url: location.href });
            } else {
                alert("Share this page with your friends!");
            }
        });

        // ── SCROLL TOP ──
        const scrollBtn = document.getElementById("scrollTopBtn");
        window.addEventListener("scroll", () => {
            scrollBtn.style.display = window.scrollY > 300 ? "block" : "none";
        });
        scrollBtn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // ── INIT ──
        loadVegetables();
    </script>

</body>
</html>
